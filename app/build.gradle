plugins { id 'com.android.application' }

android {
    namespace 'au.id.pointandyshoot.bookscanner'
    compileSdk 36
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig {
        applicationId 'au.id.pointandyshoot.bookscanner'
        minSdk 35
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/ocrAssets'))
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'org.opencv:opencv:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('verifyOcrAssets') {
    def modelDir = file('src/main/assets/ppocrv4')
    def weightsDir = rootProject.file('third_party/ppocr-models/models/ppocrv4')
    inputs.dir(modelDir)
    inputs.dir(weightsDir)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(new File(modelDir, 'provenance.json'))
        manifest.sha256.each { name, expected ->
            def asset = new File(name == 'keys.txt' ? modelDir : weightsDir, name)
            if (!asset.isFile()) throw new GradleException("Missing OCR asset: ${name}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString()
            if (actual != expected) throw new GradleException("OCR asset checksum mismatch: ${name}")
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyOcrAssets' }

tasks.register('prepareOcrAssets', Sync) {
    dependsOn 'verifyOcrAssets'
    from(rootProject.file('third_party/ppocr-models/models/ppocrv4')) {
        include 'det.param', 'det.bin', 'rec.param', 'rec.bin'
    }
    into(layout.buildDirectory.dir('generated/ocrAssets/ppocrv4'))
}
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) dependsOn 'prepareOcrAssets'
}
